[project]
name = "fusion-nlq-mcp"
version = "0.3.0"
description = "An MCP server that lets an AI agent run SQL queries against Oracle Fusion over BI Publisher SOAP. Each query runs through a temporary data model that is deleted when the call ends."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["mcp>=2.0.0,<3", "keyring>=24,<26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fusion-mcp = "fusion_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion_mcp"]
